# Target=System.err is not optional here: ConsoleAppender defaults to System.out, which is
# exactly the stream Main.java's newline-delimited JSON protocol uses. Without this, XMage's own
# logging interleaves with (and can truncate/corrupt) JSON progress lines — a real bug hit in
# practice once Main.java started emitting one JSON line per game action instead of one per
# 500ms poll, giving log4j far more chances to write mid-line. mage.game was also previously set
# to DEBUG, which is extremely chatty and served no purpose here (the narrator log reads
# structured TableEvent messages directly, never scrapes log4j text) — dropped to the root level.
log4j.rootLogger=WARN, console
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.Target=System.err
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%-5p %c{1} - %m%n
